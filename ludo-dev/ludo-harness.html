<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ludo harness — Phase 1</title>
<style>
  body { margin: 0; padding: 24px; background: #0b1020; color: #e6ecff;
         font: 13px/1.5 system-ui, sans-serif; display: flex; gap: 24px;
         align-items: flex-start; flex-wrap: wrap; }
  .panel { background: linear-gradient(160deg, #182036, #0e1526); border-radius: 14px;
           padding: 16px; box-shadow: 0 8px 32px rgba(0,0,0,.45); }
  canvas { display: block; border-radius: 10px; background: #121a2e; }
  h1 { font-size: 15px; margin: 0 0 12px; letter-spacing: .04em; text-transform: uppercase;
       opacity: .75; }
  button { background: #1e2b4a; color: #e6ecff; border: 1px solid #2f4270; border-radius: 7px;
           padding: 6px 11px; cursor: pointer; font: inherit; margin: 0 6px 6px 0; }
  button:hover { background: #27375c; }
  button.on { background: #3d6be0; border-color: #5b86f0; }
  .col { min-width: 300px; max-width: 420px; }
  pre { background: #060a16; border-radius: 8px; padding: 10px; font-size: 11px;
        max-height: 340px; overflow: auto; margin: 8px 0 0; }
  .row { margin-bottom: 10px; }
  label { opacity: .7; display: block; margin-bottom: 4px; font-size: 11px;
          text-transform: uppercase; letter-spacing: .05em; }
</style>
</head>
<body>

<div class="panel">
  <h1>Board — 368 × 368</h1>
  <canvas id="ludo-canvas" width="368" height="368"></canvas>
</div>

<div class="col">
  <div class="panel">
    <h1>Controls</h1>
    <div class="row">
      <label>Mode</label>
      <button data-mode="cpu2">PvCPU 2P</button>
      <button data-mode="pvp2">PvP 2P</button>
      <button data-mode="pvp3">PvP 3P</button>
      <button data-mode="pvp4">PvP 4P</button>
    </div>
    <div class="row">
      <label>Inspect</label>
      <button id="btn-ring">Ring indices</button>
      <button id="btn-walk">Walk a token 0 → 56</button>
      <button id="btn-scatter">Scatter tokens</button>
      <button id="btn-reset">Reset to base</button>
    </div>
    <div class="row">
      <label>Turn</label>
      <button id="btn-turn">Next player</button>
    </div>
  </div>

  <div class="panel" style="margin-top:16px">
    <h1>Walk trace</h1>
    <pre id="trace">Press “Walk a token 0 → 56”.</pre>
  </div>
</div>

<script>
// ── Stubs for the host userscript's shared plumbing ──────────────────
const FIXED_DT = 1000 / 60;
function getFrameInterval() { return 1000 / 60; }
function awardGameXP(type, perf) { console.log('[stub] awardGameXP', type, perf); }
function showXPNotification(n, r) { console.log('[stub] showXPNotification', n, r); }
let userPreferences = {
    ludoBlocks: true, ludoThreeSixes: true, ludoExactHome: true, ludoFreeRelease: false,
};
</script>
<script src="ludo-core.js"></script>
<script>
// Mode tables come from the core so the harness cannot drift from the game.
function setMode(m) {
    ludoSetMode(m);
    document.querySelectorAll('[data-mode]').forEach(b =>
        b.classList.toggle('on', b.dataset.mode === m));
    ludoRender();
}

document.querySelectorAll('[data-mode]').forEach(b =>
    b.onclick = () => setMode(b.dataset.mode));

document.getElementById('btn-ring').onclick = function () {
    ludoDebugRing = !ludoDebugRing;
    this.classList.toggle('on', ludoDebugRing);
    ludoRender();
};

document.getElementById('btn-reset').onclick = () => { ludoResetTokens(); ludoRender(); };

document.getElementById('btn-turn').onclick = () => {
    ludoTurn = (ludoTurn + 1) % ludoActive.length;
    ludoRender();
};

// Spread tokens over the ring so overlaps / safe squares / home columns are visible.
document.getElementById('btn-scatter').onclick = () => {
    ludoResetTokens();
    ludoTokens.forEach((t, k) => {
        t.inBase = false;
        t.step   = [0, 8, 13, 26, 39, 47, 50, 51, 53, 55, 4, 19, 31, 44, 22, 35][k % 16];
        t.home   = false;
    });
    ludoRender();
};

// Walk token 0 of the player to move from base all the way home, one step per
// frame, logging the cell it occupies. This is the visual counterpart to
// ludo-verify.js — the token must trace the ring, turn into its OWN colour
// column at 51, and vanish into the centre at 56.
document.getElementById('btn-walk').onclick = () => {
    const ci = ludoActive[ludoTurn];
    ludoResetTokens();
    const t = ludoTokens.find(x => x.ci === ci);
    const out = [];
    let s = 0;
    const tick = () => {
        t.inBase = false;
        t.step   = s;
        t.home   = s >= LUDO_HOME_STEP;
        const cell = ludoStepToCell(ci, s);
        const ring = ludoStepToRing(ci, s);
        out.push(
            `step ${String(s).padStart(2)}  ` +
            (cell ? `cell ${String(cell.r).padStart(2)},${String(cell.c).padStart(2)}` : 'centre    ') +
            (ring >= 0 ? `  ring ${String(ring).padStart(2)}` : '  ——     ') +
            (LUDO_SAFE_RING.has(ring) ? '  ★safe' : '') +
            (s >= 51 && s <= 55 ? '  home column' : '') +
            (s === 56 ? '  HOME' : '')
        );
        ludoMessage = `${LUDO_COLORS[ci].label} walking — step ${s}/56`;
        ludoRender();
        document.getElementById('trace').textContent = out.join('\n');
        document.getElementById('trace').scrollTop = 1e6;
        if (s++ < LUDO_HOME_STEP) setTimeout(tick, 70);
        else ludoMessage = '';
    };
    tick();
};

setMode('cpu2');
</script>
</body>
</html>
