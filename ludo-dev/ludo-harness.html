<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ludo harness</title>
<style>
  :root { --bg:#12122a; --panel:#1c1b38; --panel2:#191832; --line:#2c2b52;
          --text:#e8ecff; --muted:#9aa0c8; --accent:#7c5cff; }
  * { box-sizing: border-box; }
  body { margin:0; padding:22px; background:var(--bg); color:var(--text);
         font:13px/1.55 system-ui, -apple-system, Segoe UI, sans-serif;
         display:flex; gap:22px; align-items:flex-start; flex-wrap:wrap; }

  /* Mirrors the widget's left game column so sizing is realistic: the canvas
     is laid out at width:100%, well under its 368px backing store. */
  .game-col { width:330px; flex:0 0 330px; }
  .panel { background:linear-gradient(160deg,var(--panel),var(--panel2));
           border:1px solid var(--line); border-radius:14px; padding:14px;
           box-shadow:0 10px 34px rgba(0,0,0,.45); }
  .panel + .panel { margin-top:14px; }
  h1 { font-size:11px; margin:0 0 10px; letter-spacing:.10em; text-transform:uppercase;
       color:var(--muted); font-weight:600; }

  /* width:100% with a fixed aspect ratio — the backing store stays 344×416 and
     initLudoGame sets it, so hit-testing must scale. Matches how #pool-canvas
     is laid out in the widget. */
  #ludo-canvas { display:block; width:100%; height:auto; aspect-ratio:344/416;
                 border-radius:10px; cursor:pointer; touch-action:manipulation;
                 background:#1c1b38; }

  .controls { display:grid; grid-template-columns:repeat(4,1fr); gap:7px; margin-top:12px; }
  button { background:#2a2950; color:var(--text); border:1px solid #3b3a6b;
           border-radius:8px; padding:8px 4px; cursor:pointer; font:inherit;
           font-size:12px; transition:.14s; }
  button:hover { background:#353468; border-color:#514f92; }
  button.on { background:var(--accent); border-color:#9b83ff; }

  .tools { display:flex; flex-wrap:wrap; gap:6px; }
  .tools button { padding:6px 10px; font-size:11px; }
  label.chk { display:flex; align-items:center; gap:6px; font-size:12px;
              color:var(--muted); cursor:pointer; padding:5px 0; }
  input[type=checkbox] { accent-color:var(--accent); width:15px; height:15px; }
  pre { background:#0c0b20; border:1px solid var(--line); border-radius:8px;
        padding:9px; font-size:11px; max-height:260px; overflow:auto; margin:0;
        color:#b9c0ea; }
  .side { width:330px; flex:0 0 330px; }
  .kv { display:flex; justify-content:space-between; font-size:12px;
        padding:3px 0; border-bottom:1px dashed var(--line); }
  .kv:last-child { border-bottom:0; }
  .kv span:last-child { color:var(--muted); font-variant-numeric:tabular-nums; }
</style>
</head>
<body>

<div class="game-col">
  <div class="panel">
    <h1>Ludo</h1>
    <canvas id="ludo-canvas" width="344" height="416"></canvas>
    <div class="controls">
      <button id="btn-mode">🔄 PvCPU</button>
      <button id="btn-play">▶ Play</button>
      <button id="btn-reset">🔄 Reset</button>
      <button id="btn-max">⛶ Max</button>
    </div>
  </div>

  <div class="panel">
    <h1>Rules (⚙️ settings equivalents)</h1>
    <label class="chk"><input type="checkbox" id="p-blocks" checked> Blocks bar opponents</label>
    <label class="chk"><input type="checkbox" id="p-blockpass" checked> …and can't be jumped over</label>
    <label class="chk"><input type="checkbox" id="p-three" checked> Three sixes forfeits the turn</label>
    <label class="chk"><input type="checkbox" id="p-exact" checked> Exact roll required to finish</label>
    <label class="chk"><input type="checkbox" id="p-free"> Release on any roll (no 6 needed)</label>
  </div>

  <div class="panel">
    <h1>Board rotation</h1>
    <div class="tools">
      <button data-rot="0">Blue ↖ TL</button>
      <button data-rot="1">Blue ↙ BL</button>
      <button data-rot="2">Blue ↘ BR</button>
      <button data-rot="3">Blue ↗ TR</button>
    </div>
  </div>
</div>

<div class="side">
  <div class="panel">
    <h1>State</h1>
    <div class="kv"><span>phase</span><span id="s-phase">—</span></div>
    <div class="kv"><span>to move</span><span id="s-turn">—</span></div>
    <div class="kv"><span>dice</span><span id="s-dice">—</span></div>
    <div class="kv"><span>legal moves</span><span id="s-legal">—</span></div>
    <div class="kv"><span>turn clock</span><span id="s-clock">—</span></div>
    <div class="kv"><span>six streak</span><span id="s-six">—</span></div>
    <div class="kv"><span>cpu tier</span><span id="s-tier">—</span></div>
    <div class="kv"><span>ludoGamesWon</span><span id="s-wins">—</span></div>
  </div>

  <div class="panel">
    <h1>Inspect</h1>
    <div class="tools">
      <button id="btn-ring">Ring indices</button>
      <button id="btn-walk">Walk 0 → 56</button>
      <button id="btn-scatter">Scatter</button>
      <button id="btn-dice">Dice × 6000</button>
      <button id="btn-auto">Auto-play</button>
      <button id="btn-clear">Clear record</button>
    </div>
    <pre id="log">Press ▶ Play.</pre>
  </div>
</div>

<script>
// ── Stubs for the host userscript's shared plumbing ──────────────────
const FIXED_DT = 1000 / 60;
function getFrameInterval() { return 1000 / 60; }
function showXPNotification(n, r) { log(`XP notification: +${n} (${r})`); }
function awardGameXP(type, perf) {
    log(`awardGameXP('${type}') → ${perf.xp} XP  ` +
        `[${perf.won ? 'WIN' : 'place ' + perf.placement}, ${perf.tokensHome}/4 home, ` +
        `${perf.captures} caps, ${perf.tier}${perf.vsCPU ? '' : ', hot-seat'}]`);
}
let userPreferences = {
    ludoBlocks: true, ludoBlockPassing: true, ludoThreeSixes: true, ludoExactHome: true, ludoFreeRelease: false,
    ludoRotation: 0,
};
const logEl = () => document.getElementById('log');
function log(msg) {
    const el = logEl();
    el.textContent = (el.textContent === 'Press ▶ Play.' ? '' : el.textContent + '\n') + msg;
    el.scrollTop = 1e6;
}
</script>
<script src="ludo-core.js"></script>
<script src="ludo-ui.js"></script>
<script>
initLudoGame();

const $ = id => document.getElementById(id);

$('btn-play').onclick  = () => { startLudoGame(); };
$('btn-reset').onclick = () => { resetLudoGame(); log('reset'); };
$('btn-mode').onclick  = () => {
    $('btn-mode').textContent = '🔄 ' + cycleLudoModeAndReset();
    log('mode → ' + ludoMode);
};
$('btn-max').onclick = () => {
    const c = $('ludo-canvas');
    if (document.fullscreenElement) document.exitFullscreen();
    else c.requestFullscreen && c.requestFullscreen();
};

// Rule toggles write the same flat prefs the ⚙️ settings modal will.
const bind = (id, key) => {
    $(id).onchange = e => { userPreferences[key] = e.target.checked; log(`${key} = ${e.target.checked}`); };
};
bind('p-blocks', 'ludoBlocks');
bind('p-blockpass', 'ludoBlockPassing');
bind('p-three',  'ludoThreeSixes');
bind('p-exact',  'ludoExactHome');
bind('p-free',   'ludoFreeRelease');

$('btn-ring').onclick = function () {
    ludoDebugRing = !ludoDebugRing;
    this.classList.toggle('on', ludoDebugRing);
};

// Rotation is a pure display pref — safe to change mid-match, the loop redraws.
document.querySelectorAll('[data-rot]').forEach(b => {
    b.onclick = () => {
        userPreferences.ludoRotation = parseInt(b.dataset.rot, 10);
        document.querySelectorAll('[data-rot]').forEach(o =>
            o.classList.toggle('on', o === b));
        log('rotation → ' + b.dataset.rot + ' (' + b.textContent.trim() + ')');
    };
});
document.querySelector('[data-rot="0"]').classList.add('on');

$('btn-scatter').onclick = () => {
    resetLudoGame();
    const steps = [0, 8, 13, 26, 39, 47, 50, 51, 53, 55, 4, 19, 31, 44, 22, 35];
    ludoTokens.forEach((t, k) => {
        t.inBase = false; t.home = false; t.step = steps[k % steps.length];
    });
    log('scattered — check stacking badges and home columns');
};

// Walks token 0 of the player to move from base to home, verifying visually
// that it traces the ring and turns into its OWN colour column at step 51.
$('btn-walk').onclick = () => {
    resetLudoGame();
    const ci = ludoActive[ludoTurn];
    const t = ludoTokens.find(x => x.ci === ci);
    let s = 0;
    log(`walking ${LUDO_COLORS[ci].label} 0 → 56`);
    const tick = () => {
        t.inBase = false; t.step = s; t.home = s >= LUDO_HOME_STEP;
        const cell = ludoStepToCell(ci, s), ring = ludoStepToRing(ci, s);
        if (s % 8 === 0 || s >= 50) {
            log(`  step ${String(s).padStart(2)}  ` +
                (cell ? `cell ${cell.r},${cell.c}` : 'centre') +
                (ring >= 0 ? `  ring ${ring}` : '') +
                (LUDO_SAFE_RING.has(ring) ? '  ★' : '') +
                (s >= 51 && s <= 55 ? '  home column' : '') + (s === 56 ? '  HOME' : ''));
        }
        if (s++ < LUDO_HOME_STEP) setTimeout(tick, 55);
    };
    tick();
};

$('btn-dice').onclick = () => {
    const h = [0, 0, 0, 0, 0, 0, 0];
    for (let i = 0; i < 6000; i++) h[ludoRollDice()]++;
    log('dice × 6000 → ' + h.slice(1).map((v, i) => `${i + 1}:${v}`).join('  '));
};

// CPU-vs-CPU: temporarily treat every seat as a CPU by auto-playing whatever
// the scorer picks whenever the game is waiting on a human.
let auto = false;
$('btn-auto').onclick = function () {
    auto = !auto;
    this.classList.toggle('on', auto);
    log('auto-play ' + (auto ? 'on' : 'off'));
};
setInterval(() => {
    if (!auto || !ludoStarted) return;
    if (ludoPhase === 'awaitRoll' && !ludoIsCPUSeat(ludoActive[ludoTurn])) ludoDoRoll();
    else if (ludoPhase === 'awaitMove' && !ludoIsCPUSeat(ludoActive[ludoTurn])) {
        const m = ludoAIChooseMove(ludoActive[ludoTurn], ludoLegal, 'hard');
        if (m) ludoPlayMove(m);
    }
}, 120);

$('btn-clear').onclick = () => {
    localStorage.removeItem('ludoGamesWon');
    localStorage.removeItem('ludoRecord');
    log('cleared ludoGamesWon / ludoRecord');
};

setInterval(() => {
    const ci = ludoActive[ludoTurn];
    $('s-phase').textContent = ludoPhase;
    $('s-turn').textContent  = LUDO_COLORS[ci].label + (ludoIsCPUSeat(ci) ? ' (CPU)' : '');
    $('s-dice').textContent  = ludoRoll || ludoDiceFace;
    $('s-legal').textContent = ludoLegal.length;
    $('s-clock').textContent = ludoTurnLeft.toFixed(1) + 's';
    $('s-six').textContent   = ludoSixStreak;
    $('s-tier').textContent  = ludoCpuTier;
    $('s-wins').textContent  = localStorage.getItem('ludoGamesWon') || '0';
}, 120);
</script>
</body>
</html>
