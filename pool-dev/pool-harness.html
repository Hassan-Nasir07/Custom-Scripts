<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pool physics harness</title>
<style>
    :root { --bg: #0d1013; --panel: #161b1f; --line: #2a3238; --text: #e6e3dc; --muted: #939ca0; --accent: #7fb8ff; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, sans-serif; display: flex; gap: 16px; padding: 16px; }
    main { flex: 0 0 auto; }
    canvas { display: block; background: #0a0d0f; border-radius: 10px; cursor: crosshair; }
    aside { width: 320px; display: flex; flex-direction: column; gap: 12px; }
    fieldset { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin: 0; background: var(--panel); }
    legend { color: var(--muted); padding: 0 6px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
    label.row { display: grid; grid-template-columns: 110px 1fr 58px; align-items: center; gap: 8px; margin: 4px 0; }
    label.row span:last-child { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
    input[type=range] { width: 100%; }
    .btns { display: flex; flex-wrap: wrap; gap: 6px; }
    button { background: #222a30; color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
    button:hover { background: #2b353c; }
    #spin { width: 96px; height: 96px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, #d9d4c8 60%, #a8a296); position: relative; cursor: pointer; }
    #spin i { position: absolute; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; background: #d2352b; }
    #spin b { position: absolute; left: 50%; top: 50%; width: 57.6px; height: 57.6px; margin: -28.8px 0 0 -28.8px; border: 1px dashed rgba(0,0,0,.25); border-radius: 50%; }
    pre { margin: 0; white-space: pre-wrap; color: var(--muted); font: 12px/1.45 ui-monospace, monospace; max-height: 260px; overflow: auto; }
    .hint { color: var(--muted); font-size: 12px; margin-top: 8px; }
</style>
</head>
<body>
<main>
    <canvas id="table" width="1120" height="620" aria-label="Pool table. Press on the table and drag back from the cue ball to shoot."></canvas>
    <div class="hint">Press anywhere, drag away from the direction you want to shoot, release. Drag distance sets speed. Shift-click places the cue ball.</div>
</main>
<aside>
    <fieldset><legend>Table</legend>
        <div class="btns">
            <button id="rack">Rack</button>
            <button id="break">Break (75%)</button>
            <button id="clear">Cue ball only</button>
            <button id="trails">Trails: on</button>
            <button id="slow">Speed: 1×</button>
        </div>
    </fieldset>
    <fieldset><legend>Spin (click the ball)</legend>
        <div style="display:flex;gap:14px;align-items:center">
            <div id="spin" role="button" aria-label="Cue tip position"><b></b><i></i></div>
            <div id="spinText" style="color:var(--muted)"></div>
        </div>
    </fieldset>
    <fieldset id="knobs"><legend>Physics</legend></fieldset>
    <fieldset><legend>Last shot</legend><pre id="report">—</pre></fieldset>
</aside>

<script src="pool-physics.js"></script>
<script>
// Everything below is harness-only. The physics is the real pool-physics.js,
// whose top-level declarations are page globals when loaded as a classic script.
const KNOBS = [
    ['muSlide', 0.05, 0.4, 0.005], ['muRoll', 0.004, 0.04, 0.001], ['muSpin', 0.01, 0.1, 0.002],
    ['ballE', 0.8, 1, 0.005], ['muBall', 0, 0.12, 0.005], ['cushionE', 0.5, 0.95, 0.01],
    ['muCushion', 0, 0.5, 0.01], ['noseRise', 0, 0.45, 0.01], ['squirt', 0, 0.08, 0.002],
    ['maxSpeed', 1000, 4500, 50], ['cornerMouth', 50, 80, 1], ['sideMouth', 50, 80, 1],
];
const cfg = Object.assign({}, PP_DEFAULTS);
let world = ppCreateWorld(cfg), tip = { x: 0, y: 0 }, trailsOn = true, speedMul = 1;
let trails = {}, drag = null, lastShot = null, shotStart = 0;

const cv = document.getElementById('table'), ctx = cv.getContext('2d');
const S = 1.0, OX = cv.width / 2, OY = cv.height / 2;              // 1 px per table unit, y flipped
const toScr = (x, y) => [OX + x * S, OY - y * S];
const toWorld = (sx, sy) => [(sx - OX) / S, (OY - sy) / S];
const COLORS = ['#f3eee2', '#e9b825', '#2457c5', '#d2352b', '#6a3fa0', '#ee7a2e', '#1f8a4c', '#8c2a20',
                '#141516', '#e9b825', '#2457c5', '#d2352b', '#6a3fa0', '#ee7a2e', '#1f8a4c', '#8c2a20'];

function rebuild(keepBalls) {
    const balls = world.balls;
    world = ppCreateWorld(cfg);
    if (keepBalls) world.balls = balls;
}
function rack() { ppRack(world, ppRandom((Math.random() * 1e9) | 0)); trails = {}; report(); }

// ── Controls ─────────────────────────────────────────────────────────
const knobs = document.getElementById('knobs');
KNOBS.forEach(([k, lo, hi, step]) => {
    const row = document.createElement('label');
    row.className = 'row';
    row.innerHTML = `<span>${k}</span><input type="range" min="${lo}" max="${hi}" step="${step}" value="${cfg[k]}"><span>${cfg[k]}</span>`;
    const input = row.querySelector('input'), out = row.lastElementChild;
    input.addEventListener('input', () => {
        cfg[k] = parseFloat(input.value); out.textContent = input.value;
        rebuild(true);
    });
    knobs.appendChild(row);
});
const reset = document.createElement('button');
reset.textContent = 'Defaults';
reset.onclick = () => { Object.assign(cfg, PP_DEFAULTS); knobs.querySelectorAll('input').forEach((el, i) => { el.value = cfg[KNOBS[i][0]]; el.nextElementSibling.textContent = el.value; }); rebuild(true); };
knobs.appendChild(reset);

document.getElementById('rack').onclick = rack;
document.getElementById('break').onclick = () => { rack(); shoot(0, 0.75 * cfg.maxSpeed); };
document.getElementById('clear').onclick = () => { world.balls = [ppMakeBall(0, world.table.headX, 0)]; trails = {}; };
document.getElementById('trails').onclick = e => { trailsOn = !trailsOn; e.target.textContent = 'Trails: ' + (trailsOn ? 'on' : 'off'); };
document.getElementById('slow').onclick = e => { speedMul = speedMul === 1 ? 0.25 : speedMul === 0.25 ? 0.1 : 1; e.target.textContent = 'Speed: ' + speedMul + '×'; };

const spinEl = document.getElementById('spin'), dot = spinEl.querySelector('i');
function showSpin() {
    dot.style.left = (50 + tip.x * 50) + '%';
    dot.style.top = (50 - tip.y * 50) + '%';
    document.getElementById('spinText').innerHTML =
        `side ${tip.x >= 0 ? '+' : ''}${tip.x.toFixed(2)} R<br>height ${tip.y >= 0 ? '+' : ''}${tip.y.toFixed(2)} R<br>` +
        (Math.abs(tip.y - 0.4) < 0.05 && Math.abs(tip.x) < 0.05 ? 'natural roll' : tip.y > 0.05 ? 'follow' : tip.y < -0.05 ? 'draw' : 'stun');
}
spinEl.addEventListener('click', e => {
    const r = spinEl.getBoundingClientRect();
    let x = ((e.clientX - r.left) / r.width - 0.5) * 2, y = -((e.clientY - r.top) / r.height - 0.5) * 2;
    const m = Math.hypot(x, y);
    if (m > cfg.maxTip) { x *= cfg.maxTip / m; y *= cfg.maxTip / m; }
    tip = { x, y }; showSpin();
});
showSpin();

// ── Shooting ─────────────────────────────────────────────────────────
function cue() { return world.balls.find(b => b.id === 0 && b.state !== 'pocketed'); }
function shoot(angle, speed) {
    if (!cue()) return;
    world.log = []; trails = {}; shotStart = world.t;
    lastShot = { angle, speed, tipX: tip.x, tipY: tip.y };
    ppStrike(world, lastShot);
}
const pos = e => { const r = cv.getBoundingClientRect(); return toWorld((e.clientX - r.left) * cv.width / r.width, (e.clientY - r.top) * cv.height / r.height); };
cv.addEventListener('pointerdown', e => {
    const [x, y] = pos(e);
    if (e.shiftKey) {
        let c = cue(); if (!c) { c = ppMakeBall(0, x, y); world.balls.unshift(c); }
        Object.assign(c, { x, y, vx: 0, vy: 0, wx: 0, wy: 0, wz: 0, state: 'stationary', pocket: -1 });
        return;
    }
    if (!ppSettled(world)) return;
    drag = { x0: x, y0: y, x, y };
    cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', e => { if (drag) [drag.x, drag.y] = pos(e); });
cv.addEventListener('pointerup', () => {
    if (!drag) return;
    const dx = drag.x0 - drag.x, dy = drag.y0 - drag.y, len = Math.hypot(dx, dy);
    if (len > 4) shoot(Math.atan2(dy, dx), Math.min(1, len / 400) * cfg.maxSpeed);
    drag = null;
});

// ── Report ───────────────────────────────────────────────────────────
function report() {
    const L = world.log, el = document.getElementById('report');
    if (!lastShot) { el.textContent = '—'; return; }
    const first = L.find(e => e.type === 'ball' && (e.a === 0 || e.b === 0));
    const rails = new Set(L.filter(e => e.type === 'cushion' && e.ball !== 0).map(e => e.ball));
    const pots = L.filter(e => e.type === 'pocket').map(e => e.ball + '→P' + e.pocket);
    const c = cue();
    el.textContent =
        `speed ${lastShot.speed.toFixed(0)} u/s · tip ${lastShot.tipX.toFixed(2)}, ${lastShot.tipY.toFixed(2)}\n` +
        `first contact: ${first ? (first.a === 0 ? first.b : first.a) : 'none'}\n` +
        `object balls to a rail: ${rails.size}\n` +
        `cue-ball rails: ${L.filter(e => e.type === 'cushion' && e.ball === 0).length}\n` +
        `pots: ${pots.join(', ') || 'none'}\n` +
        `ball contacts: ${L.filter(e => e.type === 'ball').length}\n` +
        `table time: ${(world.t - shotStart).toFixed(2)} s${ppSettled(world) ? ' (settled)' : ''}\n` +
        (c ? `cue ball: ${c.state}, ${Math.hypot(c.vx, c.vy).toFixed(0)} u/s` : 'cue ball: pocketed') +
        (world.escapes ? `\nESCAPES: ${world.escapes}` : '');
}

// ── Drawing ──────────────────────────────────────────────────────────
function drawTable() {
    const t = world.table, HL = t.halfLength, HW = t.halfWidth;
    ctx.fillStyle = '#0a0d0f'; ctx.fillRect(0, 0, cv.width, cv.height);
    const [rx, ry] = toScr(-HL - 48, HW + 48);
    ctx.fillStyle = '#4a2c1b'; ctx.fillRect(rx, ry, (2 * HL + 96) * S, (2 * HW + 96) * S);
    const [fx, fy] = toScr(-HL, HW);
    ctx.fillStyle = '#1d6e55'; ctx.fillRect(fx, fy, 2 * HL * S, 2 * HW * S);
    // Throats: the felt between each pocket's jaws.
    t.pockets.forEach(p => {
        ctx.beginPath();
        const pts = [[p.jaws[0][0], p.jaws[0][1]], [p.jaws[0][2], p.jaws[0][3]], [p.jaws[1][2], p.jaws[1][3]], [p.jaws[1][0], p.jaws[1][1]]];
        pts.forEach(([x, y], i) => { const [sx, sy] = toScr(x, y); i ? ctx.lineTo(sx, sy) : ctx.moveTo(sx, sy); });
        ctx.closePath(); ctx.fillStyle = '#1d6e55'; ctx.fill();
        const [cx, cy] = toScr(p.x, p.y);
        ctx.beginPath(); ctx.arc(cx, cy, p.r * S, 0, Math.PI * 2); ctx.fillStyle = '#030404'; ctx.fill();
    });
    ctx.lineWidth = 2;
    t.segments.forEach(s => {
        const [ax, ay] = toScr(s.ax, s.ay), [bx, by] = toScr(s.bx, s.by);
        ctx.strokeStyle = s.kind === 'jaw' ? '#e0a45a' : '#9fd3b8';
        ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
    });
    ctx.fillStyle = '#e6e3dc';
    t.points.forEach(p => { const [x, y] = toScr(p.x, p.y); ctx.fillRect(x - 1.5, y - 1.5, 3, 3); });
    // Head string and spots.
    ctx.strokeStyle = 'rgba(255,255,255,.15)'; ctx.setLineDash([4, 4]);
    const [hx, hy0] = toScr(t.headX, HW), [, hy1] = toScr(t.headX, -HW);
    ctx.beginPath(); ctx.moveTo(hx, hy0); ctx.lineTo(hx, hy1); ctx.stroke(); ctx.setLineDash([]);
}
function drawBalls() {
    const R = world.cfg.ballR;
    if (trailsOn) {
        Object.entries(trails).forEach(([id, pts]) => {
            ctx.strokeStyle = id === '0' ? 'rgba(255,255,255,.55)' : 'rgba(255,255,255,.18)';
            ctx.lineWidth = 1; ctx.beginPath();
            pts.forEach(([x, y], i) => { const [sx, sy] = toScr(x, y); i ? ctx.lineTo(sx, sy) : ctx.moveTo(sx, sy); });
            ctx.stroke();
        });
    }
    world.balls.forEach(b => {
        if (b.state === 'pocketed') return;
        const [x, y] = toScr(b.x, b.y);
        ctx.beginPath(); ctx.arc(x, y, R * S, 0, Math.PI * 2);
        ctx.fillStyle = b.id > 8 ? '#f3eee2' : COLORS[b.id]; ctx.fill();
        if (b.id > 8) {
            ctx.save(); ctx.clip();
            ctx.fillStyle = COLORS[b.id]; ctx.fillRect(x - R * S, y - R * 0.5 * S, 2 * R * S, R * S);
            ctx.restore();
        }
        if (b.id) {
            ctx.fillStyle = b.id === 8 ? '#fff' : '#111'; ctx.font = '600 10px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(b.id, x, y + 0.5);
        }
        if (b.state === 'sliding') { ctx.strokeStyle = '#ffcc66'; ctx.lineWidth = 1.5; ctx.stroke(); }
    });
}
function drawAim() {
    const c = cue();
    if (!drag || !c) return;
    const dx = drag.x0 - drag.x, dy = drag.y0 - drag.y, len = Math.hypot(dx, dy);
    if (len < 4) return;
    const a = Math.atan2(dy, dx), [sx, sy] = toScr(c.x, c.y);
    ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.setLineDash([6, 5]); ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx + Math.cos(a) * 900, sy - Math.sin(a) * 900); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = 'var(--accent)'; ctx.fillStyle = '#7fb8ff';
    ctx.fillText(Math.round(Math.min(1, len / 400) * 100) + '%', sx, sy - 24);
}

let last = 0, acc = 0;
function frame(now) {
    requestAnimationFrame(frame);
    const dt = last ? Math.min(0.1, (now - last) / 1000) : 0;
    last = now;
    acc += dt * speedMul;
    let stepped = false;
    while (acc >= 1 / 60) {
        if (!ppSettled(world)) { ppStep(world, 1 / 60); stepped = true; }
        acc -= 1 / 60;
    }
    if (stepped) {
        world.balls.forEach(b => { if (b.state !== 'pocketed') (trails[b.id] = trails[b.id] || []).push([b.x, b.y]); });
        report();
    }
    drawTable(); drawBalls(); drawAim();
}
rack();
requestAnimationFrame(frame);
</script>
</body>
</html>
