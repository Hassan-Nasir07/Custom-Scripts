<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tournament bracket, compact</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&amp;family=Sora:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#07090A}
.bc-btn{cursor:pointer;transition:background .15s ease}
.bc-btn:hover{background:#242C31 !important}
.bc-tab{cursor:pointer}
.bc-btn:focus-visible,.bc-pri:focus-visible,.bc-tab:focus-visible{outline:2px solid #F0B44C;outline-offset:2px}
.bc-pri{cursor:pointer;transition:filter .15s ease,transform .1s ease}
.bc-pri:hover{filter:brightness(1.07)}
.bc-pri:active{transform:translateY(1px)}
</style>
</helmet>
<div style="width: 400px; height: 640px; box-sizing: border-box; padding: 16px; display: flex; flex-direction: column; gap: 12px; background: #0E1113; border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 20px; font-family: 'Sora', system-ui, sans-serif; color: #ECE8DF">

<div style="height: 44px; display: flex; align-items: center; gap: 10px">
<a href="Main.dc.html" class="bc-btn" aria-label="Back to table" style="width: 44px; height: 44px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: #1C2327; border: 1px solid rgba(255, 255, 255, 0.07); color: #ECE8DF">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
<div style="display: flex; flex-direction: column; gap: 1px; flex-grow: 1">
<span style="font-family: 'Chakra Petch', sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.14em; color: #9CA5A8">CITY OPEN</span>
<span style="font-family: 'Chakra Petch', sans-serif; font-size: 18px; font-weight: 600; line-height: 1.1">Bracket</span>
</div>
<span style="display: flex; align-items: center; height: 30px; padding: 0 12px; border-radius: 15px; background: #1A2024; border: 1px solid rgba(255, 255, 255, 0.08); font-family: 'Chakra Petch', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.12em; color: #C9CFCF">6 PLAYERS</span>
</div>

<div role="tablist" aria-label="Rounds" style="height: 44px; box-sizing: border-box; padding: 3px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 3px; border-radius: 12px; background: #161C1F; border: 1px solid rgba(255, 255, 255, 0.06)">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
<button type="button" role="tab" aria-selected="{{t.sel}}" class="bc-tab" onClick="{{t.pick}}" style="display: flex; align-items: center; justify-content: center; gap: 5px; border: 0; border-radius: 9px; background: {{t.bg}}; color: {{t.fg}}; font-family: 'Sora', sans-serif; font-size: 12px; font-weight: 600; padding: 0">
<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display: {{t.check}}"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>{{t.label}}</button>
</sc-for>
</div>

<div role="tabpanel" style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{matches}}" as="m" hint-placeholder-count="4">
<div style="box-sizing: border-box; height: {{m.h}}px; padding: 10px 12px; border-radius: 14px; background: {{m.bg}}; border: 1px solid {{m.border}}; box-shadow: {{m.glow}}; display: flex; flex-direction: column; gap: 6px">
<div style="height: 16px; display: flex; align-items: center; justify-content: space-between">
<span style="font-family: 'Chakra Petch', sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.14em; color: #9CA5A8">{{m.title}}</span>
<span style="display: {{m.chipDisp}}; align-items: center; height: 18px; padding: 0 7px; border-radius: 9px; background: {{m.chipBg}}; border: 1px solid {{m.chipBorder}}; color: {{m.chipFg}}; font-family: 'Chakra Petch', sans-serif; font-size: 9px; font-weight: 700; letter-spacing: 0.12em">{{m.chip}}</span>
</div>
<sc-for list="{{m.rows}}" as="r" hint-placeholder-count="2">
<div style="height: 30px; display: flex; align-items: center; gap: 10px">
<span style="width: 18px; font-family: 'Chakra Petch', sans-serif; font-size: 11px; font-weight: 600; color: #7E878A">{{r.seed}}</span>
<span style="flex-grow: 1; font-size: 14px; font-weight: {{r.w}}; color: {{r.c}}; font-style: {{r.i}}">{{r.name}}</span>
<span style="font-family: 'Chakra Petch', sans-serif; font-size: 18px; font-weight: 700; color: {{r.c}}">{{r.score}}</span>
</div>
</sc-for>
</div>
</sc-for>
<sc-if value="{{showOverview}}" hint-placeholder-val="{{true}}">
<div style="margin-top: 6px; display: flex; flex-direction: column; gap: 8px">
<span style="font-family: 'Chakra Petch', sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.14em; color: #9CA5A8">WHOLE BRACKET</span>
<div style="box-sizing: border-box; padding: 10px; border-radius: 14px; background: #121719; border: 1px solid rgba(255, 255, 255, 0.05)">
<dc-import name="BracketTree" scenario="city-sf" mini="true" width="346" height="160" hint-size="346px,160px"></dc-import>
</div>
</div>
</sc-if>
</div>

<a href="MatchIntro.dc.html" class="bc-pri" style="height: 52px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; border-radius: 12px; background: #F0B44C; color: #1B1406; text-decoration: none; box-shadow: 0 6px 18px rgba(240, 180, 76, 0.22), inset 0 1px 0 rgba(255, 255, 255, 0.35)">
<span style="font-family: 'Chakra Petch', sans-serif; font-size: 15px; font-weight: 700; letter-spacing: 0.08em">PLAY NEXT MATCH</span>
<span style="font-size: 11px; font-weight: 600; color: #3A2A0C">Ayesha vs Bilal · Semi-final</span>
</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":400,"height":640}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const tab = s.tab ?? 1;
    const AMB = '#F0B44C';
    const chipMap = {
      LIVE: ['rgba(236, 106, 61, 0.16)', 'rgba(236, 106, 61, 0.7)', '#F6A585'],
      NEXT: [AMB, AMB, '#1B1406'],
      DONE: ['#1C2327', 'rgba(255, 255, 255, 0.14)', '#9CA5A8'],
      BYE: ['#1C2327', 'rgba(255, 255, 255, 0.10)', '#9CA5A8']
    };
    const row = (seed, name, score, win, lose, tbd) => ({
      seed: seed, name: name, score: score === '' ? '' : String(score),
      w: win ? 700 : 500, c: tbd ? '#7E878A' : lose ? '#8E979A' : '#ECE8DF', i: tbd ? 'italic' : 'normal'
    });
    const M = (title, st, rows) => {
      const ch = chipMap[st];
      return {
        title, rows, h: rows.length === 2 ? 102 : 102,
        bg: st === 'NEXT' ? 'rgba(240, 180, 76, 0.08)' : '#161C1F',
        border: st === 'NEXT' ? 'rgba(240, 180, 76, 0.75)' : 'rgba(255, 255, 255, 0.06)',
        glow: st === 'NEXT' ? '0 0 24px rgba(240, 180, 76, 0.14)' : 'none',
        chip: st, chipDisp: ch ? 'flex' : 'none', chipBg: ch ? ch[0] : 'transparent', chipBorder: ch ? ch[1] : 'transparent', chipFg: ch ? ch[2] : '#9CA5A8'
      };
    };
    const pages = [
      [
        M('QF 1 · BYE', 'BYE', [row('1', 'Ayesha', '', true), row('', 'Advances to semi-final', '', false, false, true)]),
        M('QF 2 · RACE TO 1', 'DONE', [row('4', 'Bilal', 1, true), row('5', 'Zara', 0, false, true)]),
        M('QF 3 · RACE TO 1', 'DONE', [row('3', 'Sana', 1, true), row('6', 'Usman', 0, false, true)]),
        M('QF 4 · BYE', 'BYE', [row('2', 'Hamza', '', true), row('', 'Advances to semi-final', '', false, false, true)])
      ],
      [
        M('SF 1 · RACE TO 2', 'NEXT', [row('1', 'Ayesha', 0), row('4', 'Bilal', 0)]),
        M('SF 2 · RACE TO 2 · AFTER SF 1', '', [row('3', 'Sana', ''), row('2', 'Hamza', '')])
      ],
      [
        M('FINAL · RACE TO 3', '', [row('', 'Winner SF 1', '', false, false, true), row('', 'Winner SF 2', '', false, false, true)])
      ]
    ];
    return {
      tabs: ['Quarter-final', 'Semi-final', 'Final'].map((label, i) => ({
        label, sel: i === tab ? 'true' : 'false', check: i === 0 ? 'block' : 'none',
        bg: i === tab ? AMB : 'transparent', fg: i === tab ? '#1B1406' : '#C9CFCF',
        pick: () => this.setState({ tab: i })
      })),
      matches: pages[tab],
      showOverview: tab > 0
    };
  }
}
</script>
</body>
</html>
