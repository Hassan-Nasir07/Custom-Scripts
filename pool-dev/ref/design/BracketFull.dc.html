<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tournament bracket, full view</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&amp;family=Sora:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#07090A}
.bf-btn{cursor:pointer;transition:background .15s ease}
.bf-btn:hover{background:#242C31 !important}
.bf-btn:focus-visible,.bf-pri:focus-visible{outline:2px solid #F0B44C;outline-offset:2px}
.bf-pri{cursor:pointer;transition:filter .15s ease,transform .1s ease}
.bf-pri:hover{filter:brightness(1.07)}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; padding: 24px; display: flex; flex-direction: column; gap: 16px; background: radial-gradient(ellipse 70% 50% at 50% 0%, #162022 0%, #0B0E10 70%); border-radius: 20px; font-family: 'Sora', system-ui, sans-serif; color: #ECE8DF">
<div style="height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 24px">
<div style="display: flex; align-items: center; gap: 14px">
<svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#141516" stroke="#2C3337" stroke-width="1"></circle><circle cx="12" cy="11.4" r="4.8" fill="#F3EEE2"></circle><text x="12" y="13.9" text-anchor="middle" font-family="Chakra Petch, sans-serif" font-size="7" font-weight="700" fill="#141516">8</text><circle cx="8" cy="6.6" r="1.6" fill="#FFFFFF" fill-opacity="0.35"></circle></svg>
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-family: 'Chakra Petch', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.14em; color: #9CA5A8">OFFICE CUP · {{sizeLabel}}</span>
<span style="font-family: 'Chakra Petch', sans-serif; font-size: 24px; font-weight: 600; line-height: 1.1">{{stageLabel}}</span>
</div>
</div>
<div style="display: flex; align-items: center; gap: 16px; font-size: 12px; color: #9CA5A8">
<span style="display: flex; align-items: center; gap: 6px"><span style="height: 18px; padding: 0 7px; display: flex; align-items: center; border-radius: 9px; background: rgba(236, 106, 61, 0.16); border: 1px solid rgba(236, 106, 61, 0.7); color: #F6A585; font-family: 'Chakra Petch', sans-serif; font-size: 9px; font-weight: 700; letter-spacing: 0.12em">LIVE</span>At the table</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="height: 18px; padding: 0 7px; display: flex; align-items: center; border-radius: 9px; background: #F0B44C; color: #1B1406; font-family: 'Chakra Petch', sans-serif; font-size: 9px; font-weight: 700; letter-spacing: 0.12em">NEXT</span>Up next</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 18px; height: 2px; background: #F0B44C; border-radius: 1px"></span>{{pathLabel}}</span>
</div>
<div style="display: flex; align-items: center; gap: 10px">
<button type="button" class="bf-pri" style="height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 18px; border: 0; border-radius: 12px; background: #F0B44C; color: #1B1406; font-family: 'Chakra Petch', sans-serif; font-size: 14px; font-weight: 700; letter-spacing: 0.08em; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35)">
<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z"></path></svg>{{cta}}</button>
<a href="BracketCompact.dc.html" class="bf-btn" aria-label="Exit full view" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: #1C2327; border: 1px solid rgba(255, 255, 255, 0.07); color: #ECE8DF">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h5V3M21 8h-5V3M3 16h5v5M21 16h-5v5"></path></svg></a>
</div>
</div>
<div style="width: 1232px; height: 672px">
<dc-import name="BracketTree" scenario="{{scenario}}" width="1232" height="672" hint-size="1232px,672px"></dc-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"size":{"editor":"enum","options":["8","16"],"default":"8"},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const big = String(this.props.size) === '16';
    return {
      scenario: big ? 'office16' : 'office8',
      sizeLabel: big ? '16 PLAYERS' : '8 PLAYERS',
      stageLabel: big ? 'Round of 16 · 5 of 8 played' : 'Semi-finals',
      pathLabel: big ? 'Completed path · Zara' : 'Completed path · Zara',
      cta: big ? 'RESUME · AYESHA VS ALI' : 'RESUME · ZARA VS HIRA'
    };
  }
}
</script>
</body>
</html>
