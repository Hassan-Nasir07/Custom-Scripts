<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Trophy cabinet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&amp;family=Sora:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#07090A}
.tc-btn{cursor:pointer;transition:background .15s ease}
.tc-btn:hover{background:#242C31 !important}
.tc-btn:focus-visible{outline:2px solid #F0B44C;outline-offset:2px}
</style>
</helmet>
<div style="width: 400px; height: 640px; box-sizing: border-box; padding: 16px; display: flex; flex-direction: column; gap: 12px; background: #0E1113; border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 20px; font-family: 'Sora', system-ui, sans-serif; color: #ECE8DF">

<div style="height: 44px; display: flex; align-items: center; gap: 10px">
<a href="Champion.dc.html" class="tc-btn" aria-label="Back" style="width: 44px; height: 44px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: #1C2327; border: 1px solid rgba(255, 255, 255, 0.07); color: #ECE8DF">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
<div style="display: flex; flex-direction: column; gap: 1px">
<span style="font-family: 'Chakra Petch', sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.14em; color: #9CA5A8">SAVED ON THIS COMPUTER</span>
<span style="font-family: 'Chakra Petch', sans-serif; font-size: 18px; font-weight: 600; line-height: 1.1">Trophy cabinet</span>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-family: 'Chakra Petch', sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.14em; color: #9CA5A8">TITLES BY BRACKET SIZE</span>
<div role="table" aria-label="Titles by bracket size" style="border-radius: 14px; background: #161C1F; border: 1px solid rgba(255, 255, 255, 0.06); overflow: hidden">
<div role="row" style="display: grid; grid-template-columns: minmax(0, 1fr) 44px 44px 44px 60px; align-items: center; padding: 0 14px; height: 34px; border-bottom: 1px solid rgba(255, 255, 255, 0.06)">
<span role="columnheader" style="font-family: 'Chakra Petch', sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.12em; color: #9CA5A8">PLAYER</span>
<span role="columnheader" style="font-family: 'Chakra Petch', sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.12em; color: #9CA5A8; text-align: center">4</span>
<span role="columnheader" style="font-family: 'Chakra Petch', sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.12em; color: #9CA5A8; text-align: center">8</span>
<span role="columnheader" style="font-family: 'Chakra Petch', sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.12em; color: #9CA5A8; text-align: center">16</span>
<span role="columnheader" style="font-family: 'Chakra Petch', sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.12em; color: #9CA5A8; text-align: right; color: #F0B44C">TOTAL</span>
</div>
<sc-for list="{{titles}}" as="t" hint-placeholder-count="5">
<div role="row" style="display: grid; grid-template-columns: minmax(0, 1fr) 44px 44px 44px 60px; align-items: center; padding: 0 14px; height: 40px; border-top: {{t.line}}">
<span role="rowheader" style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#F0B44C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="opacity: {{t.crown}}"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4zM17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"></path></svg>{{t.name}}</span>
<span role="cell" style="text-align: center; font-family: 'Chakra Petch', sans-serif; font-size: 14px; font-weight: 600; color: {{t.c4}}">{{t.s4}}</span>
<span role="cell" style="text-align: center; font-family: 'Chakra Petch', sans-serif; font-size: 14px; font-weight: 600; color: {{t.c8}}">{{t.s8}}</span>
<span role="cell" style="text-align: center; font-family: 'Chakra Petch', sans-serif; font-size: 14px; font-weight: 600; color: {{t.c16}}">{{t.s16}}</span>
<span role="cell" style="text-align: right; font-family: 'Chakra Petch', sans-serif; font-size: 16px; font-weight: 700; color: #F4E3BF">{{t.total}}</span>
</div>
</sc-for>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px; min-height: 0; flex-grow: 1">
<span style="font-family: 'Chakra Petch', sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.14em; color: #9CA5A8">RECENT TOURNAMENTS</span>
<div role="list" style="display: flex; flex-direction: column; gap: 6px">
<sc-for list="{{recent}}" as="r" hint-placeholder-count="5">
<div role="listitem" style="height: 46px; box-sizing: border-box; padding: 0 14px; display: flex; align-items: center; gap: 12px; border-radius: 12px; background: #161C1F; border: 1px solid rgba(255, 255, 255, 0.06)">
<span style="width: 34px; height: 22px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 11px; border: 1px solid rgba(255, 255, 255, 0.12); font-family: 'Chakra Petch', sans-serif; font-size: 11px; font-weight: 700; color: #C9CFCF">{{r.size}}</span>
<span style="display: flex; flex-direction: column; gap: 1px; flex-grow: 1; min-width: 0">
<span style="font-size: 13px; font-weight: 600">{{r.name}}</span>
<span style="font-size: 11px; color: #9CA5A8">{{r.meta}}</span>
</span>
<span style="display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: #F4E3BF">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#F0B44C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4zM17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"></path></svg>{{r.champ}}</span>
</div>
</sc-for>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":400,"height":640}}'>
class Component extends DCLogic {
  renderVals() {
    const rows = [['Ayesha', 2, 3, 1], ['Sana', 3, 1, 0], ['Zara', 0, 1, 1], ['Bilal', 1, 1, 0], ['Hamza', 1, 0, 0]];
    const col = (v) => v ? '#ECE8DF' : '#5A6468';
    return {
      titles: rows.map((r, i) => ({
        name: r[0], s4: r[1] || '–', s8: r[2] || '–', s16: r[3] || '–',
        c4: col(r[1]), c8: col(r[2]), c16: col(r[3]),
        total: r[1] + r[2] + r[3], crown: i === 0 ? 1 : 0,
        line: i === 0 ? '0 solid transparent' : '1px solid rgba(255, 255, 255, 0.05)'
      })),
      recent: [
        { name: 'City Open', meta: 'Sep 25, 2026 · 6 players', size: '8', champ: 'Ayesha' },
        { name: 'Friday Frames', meta: 'Sep 18, 2026 · 4 players', size: '4', champ: 'Sana' },
        { name: 'Lunch League', meta: 'Sep 11, 2026 · 8 players', size: '8', champ: 'Ayesha' },
        { name: 'Monsoon Cup', meta: 'Aug 28, 2026 · 13 players', size: '16', champ: 'Zara' },
        { name: 'Quarter-end Knockout', meta: 'Jun 30, 2026 · 5 players', size: '8', champ: 'Bilal' }
      ]
    };
  }
}
</script>
</body>
</html>
